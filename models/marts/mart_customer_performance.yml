version: 2

models: 
  - name: mart_customer_performance
    description: "Information about average customers spending and total rentals"
    columns: 
      - name: customer_id 
        description: "Unique identifier for each customer"
        tests:
         - unique 
         - not_null
      - name: customer_name
        description: "Customer full name"
        tests:
          - not_null
      - name: total_rental
        description: "Total customers rented the film"
        tests: 
          - not_null
      - name: first_rented_at
        description: "When customers first time rented"
      - name: latest_rented_at
        description: "When customers latest rented"
      - name: lifetime_total_payment
        description: "Total amount customers already spend to rent"
        tests: 
          - not_null
      - name: average_payment
        description: "Average amount customers spend per transactions"
        tests: 
          - not_null
          - dbt_utils.accepted_range: 
              arguments:
                min_value: 0