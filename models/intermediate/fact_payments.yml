version: 2

models: 
  - name: fact_payments
    description: "Contain payment information for customers who made the rental transactions"
    columns:
      - name: payment_id
        description: "Unique identifier for each transactions"
        tests:
          - unique 
          - not_null
      - name: paid_at
        description: "When the transactions is made by customers"
        tests: 
          - not_null
      - name: customer_id 
        description: "Identifier for customers who made the transactions"
        tests: 
          - not_null
          - relationships: 
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: customer_name
        description: "Full name for customers"
        tests:
          - not_null
      - name: staff_id
        description: "Staff who processed the transactions"
        tests:
          - not_null
      - name: store_id
        description: "Where the transactions happened"
        tests: 
          - not_null
      - name: rental_id
        description: "identifier to check date and time customers rented the film"
        tests: 
          - not_null
      - name: film_id
        description: "Identifier for film"
        tests: 
          - not_null
      - name: film_title
        description: "Title of the film"
        tests: 
          - not_null
      - name: amount
        description: "How much customers paid to rent the film"
        tests: 
          - not_null
